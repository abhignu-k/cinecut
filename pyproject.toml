[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cinecut"
version = "0.1.0"
description = "Context-aware, rhythm- and story-synced AI cinematic vertical edit engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Abhignu Kareddy" }]
keywords = ["video-editing", "ffmpeg", "ai", "music-sync", "opentimelineio", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "librosa>=0.10.2",
    "numpy>=1.26.0,<2.2.0",
    "opencv-python-headless>=4.9.0,<4.12.0",
    "opentimelineio>=0.17.0,<0.18.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "scenedetect>=0.6.4",
    "soundfile>=0.12.1",
    "typer>=0.12.0",
]

[project.optional-dependencies]
stems = ["demucs>=4.0.1"]
yt = ["yt-dlp>=2024.10.0"]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
cinecut = "cinecut.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cinecut"]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "demucs.*",
    "librosa.*",
    "opentimelineio.*",
    "scenedetect.*",
    "soundfile.*",
    "yt_dlp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["cinecut"]
branch = true

[tool.coverage.report]
show_missing = true
